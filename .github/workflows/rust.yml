name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
    - name: Archive artifact
      uses: actions/upload-artifact@v7
      with:
        path: |
          target/release/rdns
          target/release/rdns-control
          rdns.toml.example
          dist/rdns.service
    

    
        
